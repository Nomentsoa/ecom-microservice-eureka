spring:
  application:
    name: notification-service

#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest

  rabbitmq:
    addresses: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:guest}
    connection-timeout: 30000

  cloud:
    function:
      definition: cartCreated
    stream:
      bindings:
        cartCreated-in-0:
          destination: cart.exchange.new
          group: notification-group
          content-type: application/json

server:
  port: 8085

rabbitmq:
  exchange:
    name: cart.exchange
  queue:
    name: cart.queue
  routing:
    key: cart.tracking


