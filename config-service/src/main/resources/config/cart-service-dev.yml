build:
  name: "Cart Dev Update"

spring:
  #local config
#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest

# onlice cloudAMQP
  rabbitmq:
    addresses: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:guest}
 #   connection-timeout: 30000

  cloud:
    stream:
      bindings:
        addToCart-out-0:
          destination: cart.exchange
          content-type: application/json
      rabbit:
        bindings:
          addToCart-out-0:
            producer:
              routing-key-expression: '''cart.tracking'''


rabbitmq:
  exchange:
    name: cart.exchange
  queue:
    name: cart.queue
  routing:
    key: cart.tracking